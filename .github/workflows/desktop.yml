name: Desktop checks and installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgbm1 libasound2t64
      - name: Allow sandbox user namespaces for test binaries
        if: runner.os == 'Linux'
        run: bash .github/scripts/linux-sandbox.sh
      - name: Electron tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Electron tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: Build installer
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Packaged app smoke test
        if: runner.os != 'Linux'
        run: pnpm test:packaged
      - name: Packaged app smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
